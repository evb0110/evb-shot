name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      NSUnbufferedIO: 'YES'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check build and publication scripts
        run: bash -n scripts/*.sh
      - name: Build native app
        run: bash scripts/build-app.sh
      - name: Exercise image editor and native controls
        run: |
          for iteration in {1..20}; do
            echo "Native editor iteration $iteration"
            bash scripts/run-native-check.sh "dist/EVB Shot.app/Contents/MacOS/EVBShot" --editor-test "$PWD/.devkit/ci-editor-$iteration"
            python3 scripts/verify-editor.py ".devkit/ci-editor-$iteration"
          done
      - name: Verify Finder installer layout and Retina background
        run: |
          bash scripts/prepare-dmg-tools.sh
          .devkit/dependencies/dmgbuild/bin/python scripts/build-dmg.py "dist/EVB Shot.app" .devkit/installer.dmg
          mkdir -p .devkit/installer-mounted
          hdiutil attach -readonly -nobrowse -noautoopen -mountpoint "$PWD/.devkit/installer-mounted" .devkit/installer.dmg
          trap 'hdiutil detach "$PWD/.devkit/installer-mounted"' EXIT
          .devkit/dependencies/dmgbuild/bin/python scripts/verify-dmg-layout.py .devkit/installer-mounted
          codesign --verify --deep --strict ".devkit/installer-mounted/EVB Shot.app"
      - name: Verify full-resolution scrolling and media exports
        run: |
          bash scripts/run-native-check.sh "dist/EVB Shot.app/Contents/MacOS/EVBShot" --self-test "$PWD/.devkit/ci-core"
          python3 scripts/verify-png.py .devkit/ci-core
      - name: Verify landing assets and links
        run: python3 scripts/verify-landing.py
      - name: Report native crash diagnostics
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for report in (Path.home()/'Library/Logs/DiagnosticReports').rglob('EVBShot*.ips'):
              print(report.name, flush=True)
              print(report.read_text(), flush=True)
          PY
