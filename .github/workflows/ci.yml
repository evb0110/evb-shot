name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build native app
        run: bash scripts/build-app.sh
      - name: Exercise image editor and native controls
        run: |
          "dist/EVB Shot.app/Contents/MacOS/EVBShot" --editor-test "$PWD/.devkit/ci-editor"
          python3 scripts/verify-editor.py .devkit/ci-editor
      - name: Verify full-resolution scrolling and media exports
        run: |
          "dist/EVB Shot.app/Contents/MacOS/EVBShot" --self-test "$PWD/.devkit/ci-core"
          python3 scripts/verify-png.py .devkit/ci-core
      - name: Verify landing assets and links
        run: python3 scripts/verify-landing.py
